# Spark Test Configuration
# This file contains Spark configuration settings optimized for testing

# Basic Spark settings
spark.app.name=singularity-spark-test
spark.master=local[*]
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true

# Memory settings for testing
spark.driver.memory=2g
spark.executor.memory=2g
spark.driver.maxResultSize=1g

# Logging settings
spark.sql.adaptive.logLevel=WARN
spark.sql.execution.arrow.pyspark.enabled=false

# Performance settings for local testing
spark.sql.adaptive.skewJoin.enabled=true
spark.sql.adaptive.localShuffleReader.enabled=true

# Disable unnecessary features for testing
spark.sql.adaptive.advisoryPartitionSizeInBytes=64MB
spark.sql.adaptive.coalescePartitions.minPartitionNum=1
spark.sql.adaptive.coalescePartitions.initialPartitionNum=8
