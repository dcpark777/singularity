# Test Application Configuration
app {
  name = "singularity-spark-test"
  version = "0.1.0-SNAPSHOT"
  environment = "test"
}

spark {
  test {
    enabled = true
    logLevel = "WARN"
    memory = "2g"
  }
}

logging {
  level = "WARN"
  pattern = "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
}
